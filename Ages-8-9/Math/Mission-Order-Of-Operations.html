<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission: Order of Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffaf0; --ink:#2b2b3a; --muted:#6b6b80;
  --blue:#2f6fdf; --green:#1f9d63; --red:#e5484d; --yellow:#ffe066;
  --orange:#f07a2a; --purple:#7c4ddb; --soft:#f4efe2;
  color-scheme:light;
}
button{color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Patrick Hand',cursive; color:var(--ink); min-height:100vh;
  background:var(--paper);
  background-image:linear-gradient(#ebe4d2 1px,transparent 1px);
  background-size:100% 34px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 48px}
.card{
  background:#fff;border:2.5px solid var(--ink);
  border-radius:20px 14px 22px 12px / 12px 22px 14px 20px;
  box-shadow:4px 5px 0 var(--ink);padding:18px;margin:16px 0;
}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lang{display:flex;gap:6px}
.lang button{font:inherit;font-size:17px;padding:3px 10px;border:2px solid var(--ink);background:#fff;border-radius:10px 8px 12px 7px;cursor:pointer}
.lang button.on{background:var(--yellow)}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;line-height:1.1;margin:10px 0 4px}
h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;margin:0 0 10px}
.sub{font-size:20px;color:var(--muted);margin:0}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.rules li{display:flex;align-items:center;gap:12px;font-size:20px;line-height:1.2}
.badge{flex:0 0 46px;height:46px;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:22px;
  border:2.5px solid var(--ink);border-radius:50% 45% 52% 48%;}
.b1{background:#ffd8bf;color:var(--orange)} .b2{background:#e6dcff;color:var(--purple)} .b3{background:#d6e6ff;color:var(--blue)}
.levels{display:grid;gap:12px}
.lvl{font:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;
  background:#fff;border:2.5px solid var(--ink);border-radius:16px 12px 18px 10px;padding:12px 14px;box-shadow:3px 4px 0 var(--ink);transition:transform .08s}
.lvl:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.lvl .ic{font-size:34px}
.lvl b{font-family:'Baloo 2';font-size:20px;display:block}
.lvl span{font-size:18px;color:var(--muted)}
.lvl .best{margin-left:auto;font-size:16px;color:var(--green);white-space:nowrap}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:19px;gap:8px;flex-wrap:wrap}
.pill{border:2px solid var(--ink);border-radius:12px 9px 13px 8px;padding:2px 10px;background:#fff}
.back{font:inherit;font-size:18px;background:none;border:none;cursor:pointer;color:var(--blue);padding:0}
.progress{height:14px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;margin:10px 0 0}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}
.expr{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(30px,9vw,46px);text-align:center;
  letter-spacing:1px;line-height:1.5;margin:6px 0 4px;word-break:keep-all}
.tok{display:inline-block;padding:0 3px}
.op{color:var(--blue)} .op.md{color:var(--purple)} .par{color:var(--orange)}
.hl{background:var(--yellow);border-radius:10px 6px 12px 5px;box-shadow:0 0 0 2px var(--ink) inset;padding:0 4px;display:inline-block}
.eq{color:var(--muted)}
.answer{margin:8px auto 0;width:170px;min-height:64px;border:3px dashed var(--ink);border-radius:16px 12px 18px 10px;
  display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:38px;background:var(--soft)}
.answer.empty{color:#b9b2a0}
.answer.ok{border-style:solid;border-color:var(--green);background:#dff5e9;color:var(--green)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.key{font-family:'Baloo 2';font-weight:800;font-size:26px;padding:8px 0;cursor:pointer;background:#fff;
  border:2.5px solid var(--ink);border-radius:14px 10px 15px 9px;box-shadow:2px 3px 0 var(--ink);color:var(--ink);user-select:none}
.key:active{transform:translate(2px,2px);box-shadow:0 1px 0 var(--ink)}
.key.go{background:var(--green);color:#fff}
.key.del{background:#ffe1e1}
.key:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;font:inherit;font-size:21px;cursor:pointer;padding:10px 12px;border:2.5px solid var(--ink);
  border-radius:14px 10px 16px 9px;box-shadow:3px 4px 0 var(--ink);background:#fff;color:var(--ink)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.hint{background:var(--yellow)}
.btn.next{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:3px 4px 0 var(--ink)}
.small{font-size:16px;color:var(--muted);text-align:center;margin-top:6px}
.hintbox{border:2.5px dashed var(--orange);background:#fff6e8;border-radius:16px 12px 18px 10px;padding:12px 14px;margin-top:14px;font-size:20px}
.hintbox .t{font-family:'Baloo 2';font-weight:800;color:var(--orange);font-size:17px;text-transform:uppercase;letter-spacing:.5px}
.hintbox .mini{font-family:'Baloo 2';font-weight:800;font-size:26px;text-align:center;margin:6px 0}
.steps{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.steps li{font-family:'Baloo 2';font-weight:600;font-size:20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.steps .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px}
.steps .calc{color:var(--green);font-weight:800}
.fb{margin-top:14px;font-size:21px;text-align:center;padding:10px;border-radius:14px 10px 16px 9px}
.fb.good{background:#dff5e9;border:2.5px solid var(--green)}
.fb.bad{background:#ffe8e8;border:2.5px solid var(--red)}
.fb.info{background:#e8f0ff;border:2.5px solid var(--blue)}
.fb b{font-family:'Baloo 2';font-size:24px}
.stars{font-size:56px;text-align:center;letter-spacing:6px;margin:4px 0}
.center{text-align:center}
.big{font-family:'Baloo 2';font-weight:800;font-size:28px}
.hidden{display:none!important}
.pop{position:fixed;pointer-events:none;font-size:28px;animation:pop 1s ease-out forwards;z-index:9}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span style="font-size:28px">🧮</span>
    <div class="lang hidden"><button id="lang-es">ES</button><button id="lang-en" class="on">EN</button></div>
  </div>

  <!-- START -->
  <section id="start">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="subtitle"></p>
    <div class="card">
      <h2 data-t="rulesTitle"></h2>
      <ul class="rules">
        <li><span class="badge b1">( )</span><span data-t="r1"></span></li>
        <li><span class="badge b2">× ÷</span><span data-t="r2"></span></li>
        <li><span class="badge b3">+ −</span><span data-t="r3"></span></li>
      </ul>
    </div>
    <h2 data-t="chooseLevel" style="margin-top:20px"></h2>
    <div class="levels" id="levels"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">
    <div class="bar">
      <button class="back" id="backBtn" data-t="back"></button>
      <span class="pill" id="qn"></span>
      <span class="pill">⭐ <span id="score">0</span></span>
      <span class="pill">🔥 <span id="streak">0</span></span>
    </div>
    <div class="progress"><i id="prog" style="width:0"></i></div>

    <div class="card">
      <div class="expr" id="expr"></div>
      <div class="answer empty" id="answer">?</div>
      <div class="keypad" id="keypad"></div>
      <div class="row">
        <button class="btn hint" id="hintBtn"></button>
        <button class="btn next hidden" id="nextBtn"></button>
      </div>
      <div class="small" id="hintCost"></div>
      <div id="hints"></div>
      <div id="fb"></div>
    </div>
  </section>

  <!-- END -->
  <section id="end" class="hidden">
    <div class="card center">
      <h1 data-t="endTitle"></h1>
      <div class="stars" id="stars"></div>
      <p class="big" id="endScore"></p>
      <p style="font-size:21px" id="endMsg"></p>
      <p style="font-size:22px;color:var(--green)" id="record"></p>
      <div class="row">
        <button class="btn next" id="againBtn" data-t="again"></button>
        <button class="btn" id="levelsBtn" data-t="levels"></button>
      </div>
    </div>
  </section>
</div>

<script>
/* ---------- textos / texts ---------- */
const T = {
 es:{
  title:'¡Misión: Operaciones combinadas!',
  subtitle:'Resuelve cada cuenta en el orden correcto y gana estrellas.',
  rulesTitle:'🔑 El orden secreto',
  r1:'Primero, lo que está entre paréntesis ( )',
  r2:'Después, multiplicaciones y divisiones, de izquierda a derecha',
  r3:'Al final, sumas y restas, de izquierda a derecha',
  chooseLevel:'Elige tu nivel',
  lv:[['Nivel 1','Sumas, restas y multiplicaciones'],['Nivel 2','¡Llegan las divisiones!'],['Nivel 3','Con paréntesis']],
  best:s=>`Récord: ${s}`,
  back:'← Niveles',
  qn:(n,m)=>`${n} / ${m}`,
  hint:n=>`💡 Pista (${n})`,
  noHints:'💡 Sin pistas',
  hintCost:'Cada pista resta 3 puntos. ¡Úsalas si te atascas!',
  next:'Siguiente →', finish:'Ver resultado 🏁',
  h1t:'Pista 1 · ¿Por dónde empiezo?',
  h1:'Empieza por la parte marcada en amarillo.',
  reason_paren:'Va primero porque está entre paréntesis.',
  reason_muldiv:'Las multiplicaciones y divisiones van antes que las sumas y restas.',
  reason_addsub:'Solo quedan sumas y restas: se hacen de izquierda a derecha.',
  h2t:'Pista 2 · Primer paso',
  h2a:'Calcula esa parte:',
  h2b:'Ahora la cuenta queda así (sigue por lo amarillo):',
  h2c:'¡Ya solo te queda un número!',
  h3t:'Pista 3 · Solución paso a paso',
  solTitle:'Así se resuelve:',
  correct:['¡Correcto! 🎉','¡Genial! ⭐','¡Muy bien! 🚀','¡Eres un crack! 💪','¡Perfecto! 🌟'],
  pts:p=>`+${p} puntos`,
  wrong:'Casi… ¡inténtalo otra vez!',
  wrongLTR:'¡Ojo! Has ido de izquierda a derecha sin más. Recuerda: × y ÷ van antes que + y −.',
  wrongParen:'¡Ojo! Te has saltado los paréntesis. Lo que está dentro de ( ) va siempre primero.',
  tryHint:'¿Y si pides una pista? 💡',
  revealed:'Ahora ya sabes cómo se hace. ¡A por la siguiente!',
  endTitle:'¡Misión cumplida!',
  endScore:s=>`${s} de 100 puntos`,
  end3:'¡Increíble! Dominas el orden de las operaciones.',
  end2:'¡Muy bien! Un poco más de práctica y serás experta o experto.',
  end1:'¡Buen comienzo! Repasa el orden secreto y vuelve a intentarlo.',
  again:'Jugar otra vez', levels:'Cambiar de nivel',
  record:'🏆 ¡Nuevo récord!'
 },
 en:{
  title:'Mission: Order of Operations!',
  subtitle:'Solve each problem in the right order and earn stars.',
  rulesTitle:'🔑 The secret order',
  r1:'First, whatever is inside brackets ( )',
  r2:'Then multiplication and division, from left to right',
  r3:'Last, addition and subtraction, from left to right',
  chooseLevel:'Choose your level',
  lv:[['Level 1','Adding, subtracting and multiplying'],['Level 2','Here comes division!'],['Level 3','With brackets']],
  best:s=>`Best: ${s}`,
  back:'← Levels',
  qn:(n,m)=>`${n} / ${m}`,
  hint:n=>`💡 Hint (${n})`,
  noHints:'💡 No hints left',
  hintCost:'Each hint costs 3 points. Use them if you get stuck!',
  next:'Next →', finish:'See results 🏁',
  h1t:'Hint 1 · Where do I start?',
  h1:'Start with the part marked in yellow.',
  reason_paren:'It goes first because it is inside brackets.',
  reason_muldiv:'Multiplication and division come before addition and subtraction.',
  reason_addsub:'Only + and − are left: do them from left to right.',
  h2t:'Hint 2 · First step',
  h2a:'Work out that part:',
  h2b:'Now the problem looks like this (keep going with the yellow part):',
  h2c:'Only one number left!',
  h3t:'Hint 3 · Step-by-step solution',
  solTitle:'Here is how to solve it:',
  correct:['Correct! 🎉','Great! ⭐','Well done! 🚀','You rock! 💪','Perfect! 🌟'],
  pts:p=>`+${p} points`,
  wrong:'Almost… try again!',
  wrongLTR:'Careful! You just went from left to right. Remember: × and ÷ come before + and −.',
  wrongParen:'Careful! You skipped the brackets. What is inside ( ) always goes first.',
  tryHint:'Why not ask for a hint? 💡',
  revealed:'Now you know how it works. On to the next one!',
  endTitle:'Mission complete!',
  endScore:s=>`${s} out of 100 points`,
  end3:'Amazing! You have mastered the order of operations.',
  end2:'Very good! A bit more practice and you will be an expert.',
  end1:'Good start! Review the secret order and try again.',
  again:'Play again', levels:'Change level',
  record:'🏆 New record!'
 }
};
let lang='en';
const t=(k,...a)=>{const v=T[lang][k];return typeof v==='function'?v(...a):v;};

/* ---------- utilidades ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const N=v=>({t:'n',v}), O=v=>({t:'o',v}), LP={t:'('}, RP={t:')'};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- motor de cálculo paso a paso ---------- */
function step(tk,prec){
  let lo=0,hi=tk.length-1,inParen=false;
  const close=tk.findIndex(x=>x.t===')');
  if(close>=0){let open=close;while(tk[open].t!=='(')open--;lo=open+1;hi=close-1;inParen=true;}
  let idx=-1;
  if(prec) for(let i=lo;i<=hi;i++) if(tk[i].t==='o'&&(tk[i].v==='×'||tk[i].v==='÷')){idx=i;break;}
  if(idx<0) for(let i=lo;i<=hi;i++) if(tk[i].t==='o'){idx=i;break;}
  if(idx<0) return null;
  const a=tk[idx-1].v,b=tk[idx+1].v,op=tk[idx].v;
  let r;
  if(op==='+')r=a+b; else if(op==='−')r=a-b; else if(op==='×')r=a*b;
  else{ if(b===0||a%b!==0) return null; r=a/b; }
  if(r<0) return null;
  const reason=inParen?'paren':(op==='×'||op==='÷')?'muldiv':'addsub';
  const nt=[...tk.slice(0,idx-1),N(r),...tk.slice(idx+2)];
  const j=idx-1;
  if(inParen&&nt[j-1]&&nt[j-1].t==='('&&nt[j+1]&&nt[j+1].t===')'){nt.splice(j+1,1);nt.splice(j-1,1);}
  return {hl:[idx-1,idx+1],a,b,op,r,reason,before:tk,next:nt};
}
function solve(tk,prec){
  const steps=[];let cur=tk,guard=0;
  while(cur.length>1&&guard++<20){const s=step(cur,prec);if(!s)return null;steps.push(s);cur=s.next;}
  if(cur.length!==1||cur[0].t!=='n')return null;
  return {steps,value:cur[0].v};
}
const key=tk=>tk.map(x=>x.t==='n'?x.v:x.t==='o'?x.v:x.t).join(' ');

/* ---------- generador de ejercicios ---------- */
function build(level){
  if(level===1){
    const ops=shuffle(['×',pick(['+','−'])]);
    if(Math.random()<.3) ops.push(pick(['+','−']));
    const tk=[N(R(2,12))];
    ops.forEach(o=>{tk.push(O(o));tk.push(N(o==='×'?R(2,9):R(2,15)));});
    return tk;
  }
  if(level===2){
    const n=pick([2,3,3]);
    let ops=['÷',pick(['+','−'])]; if(n===3) ops.push(pick(['+','−','×']));
    ops=shuffle(ops);
    const tk=[N(ops[0]==='÷'?R(6,60):R(2,12))];
    ops.forEach((o,i)=>{tk.push(O(o));const nx=ops[i+1];tk.push(N(o==='÷'?R(2,10):nx==='÷'?R(6,60):R(2,12)));});
    return tk;
  }
  // nivel 3: paréntesis
  const s=()=>pick(['+','−']), m=()=>pick(['×','×','÷']), any=()=>pick(['+','−','×']);
  const n=()=>R(1,12);
  const tpl=R(1,5);
  if(tpl===1) return [LP,N(n()),O(s()),N(n()),RP,O(m()),N(R(2,9))];
  if(tpl===2) return [N(R(2,40)),O(m()),LP,N(n()),O(s()),N(n()),RP];
  if(tpl===3) return [LP,N(n()),O(s()),N(n()),RP,O(m()),LP,N(n()),O(s()),N(n()),RP];
  if(tpl===4) return [N(R(2,20)),O(s()),N(R(2,9)),O('×'),LP,N(n()),O(s()),N(n()),RP];
  return [N(R(2,30)),O(any()),LP,N(n()),O(s()),N(n()),RP,O(m()),N(R(2,6))];
}
function gen(level){
  let fallback=null;
  for(let k=0;k<6000;k++){
    const tk=build(level);
    const sol=solve(tk,true);
    if(!sol||sol.value>120||sol.steps.some(s=>s.r>120))continue;
    // tablas de multiplicar: × y ÷ dentro del 10 × 10
    if(sol.steps.some(s=>(s.op==='×'&&(s.a>10||s.b>10))||(s.op==='÷'&&(s.b>10||s.r>10))))continue;
    const kk=key(tk); if(S.seen.has(kk))continue;
    const ltr=solve(tk,false);
    const hasP=tk.some(x=>x.t==='(');
    const nop=hasP?solve(tk.filter(x=>x.t!=='('&&x.t!==')'),true):null;
    const c={tokens:tk,sol,ltr:ltr?ltr.value:null,nop:nop?nop.value:null,key:kk};
    const tricky=hasP?(c.nop!==null&&c.nop!==sol.value):(c.ltr!==sol.value);
    if(tricky||Math.random()<.12){S.seen.add(kk);return c;}
    if(!fallback)fallback=c;
  }
  S.seen.add(fallback.key);return fallback;
}

/* ---------- pintar expresiones ---------- */
function exprHTML(tk,hl){
  let h='';
  tk.forEach((x,i)=>{
    if(hl&&i===hl[0])h+='<span class="hl">';
    if(x.t==='n')h+=`<span class="tok">${x.v}</span>`;
    else if(x.t==='o')h+=`<span class="tok op${(x.v==='×'||x.v==='÷')?' md':''}">${x.v}</span>`;
    else h+=`<span class="tok par">${x.t}</span>`;
    if(hl&&i===hl[1])h+='</span>';
  });
  return h;
}
function stepsHTML(sol){
  let h='<ol class="steps">';
  sol.steps.forEach((s,i)=>{
    h+=`<li><span class="n">${i+1}</span><span>${exprHTML(s.before,s.hl)}</span><span class="calc">→ ${s.a} ${s.op} ${s.b} = ${s.r}</span></li>`;
  });
  return h+`</ol><div class="mini">= ${sol.value}</div>`;
}

/* ---------- estado del juego ---------- */
const TOTAL=10, MAXH=3;
const S={level:1,qn:0,score:0,streak:0,cur:null,input:'',hints:0,wrong:0,state:'play',fb:null,seen:new Set()};

function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);}

function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('lang-es').classList.toggle('on',lang==='es');$('lang-en').classList.toggle('on',lang==='en');
  const icons=['🚀','🍕','🎁'];
  $('levels').innerHTML=T[lang].lv.map((l,i)=>{
    const b=store.get('oc-best-'+(i+1));
    return `<button class="lvl" data-l="${i+1}"><span class="ic">${icons[i]}</span><span><b>${l[0]}</b><span>${l[1]}</span></span>${b!==null?`<span class="best">${t('best',b)}</span>`:''}</button>`;
  }).join('');
  document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>startLevel(+b.dataset.l));
  if(!$('game').classList.contains('hidden'))renderGame();
  if(!$('end').classList.contains('hidden'))renderEnd();
}

function startLevel(l){
  Object.assign(S,{level:l,qn:0,score:0,streak:0,seen:new Set()});
  show('game');newQuestion();
}
function newQuestion(){
  S.qn++;S.cur=gen(S.level);S.input='';S.hints=0;S.wrong=0;S.state='play';S.fb=null;
  renderGame();
}

function renderGame(){
  const c=S.cur;
  $('qn').textContent=t('qn',S.qn,TOTAL);
  $('score').textContent=S.score;$('streak').textContent=S.streak;
  $('prog').style.width=((S.qn-1+(S.state==='play'?0:1))/TOTAL*100)+'%';
  const showHl=S.state==='play'&&S.hints>=1;
  $('expr').innerHTML=exprHTML(c.tokens,showHl?c.sol.steps[0].hl:null)+' <span class="eq">=</span>';
  const a=$('answer');
  a.textContent=S.state==='play'?(S.input||'?'):c.sol.value;
  a.className='answer'+(S.state==='play'&&!S.input?' empty':'')+(S.state!=='play'?' ok':'');
  // teclado
  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  $('keypad').innerHTML=keys.map(k=>`<button class="key${k==='✓'?' go':k==='⌫'?' del':''}" data-k="${k}" ${S.state!=='play'?'disabled':''}>${k}</button>`).join('');
  document.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k));
  // botones
  const hb=$('hintBtn');
  const left=MAXH-S.hints;
  hb.textContent=left>0?t('hint',left):t('noHints');
  hb.disabled=S.state!=='play'||left<=0;
  hb.classList.toggle('hidden',S.state!=='play');
  const nb=$('nextBtn');
  nb.classList.toggle('hidden',S.state==='play');
  nb.textContent=S.qn>=TOTAL?t('finish'):t('next');
  $('hintCost').textContent=S.state==='play'?t('hintCost'):'';
  // pistas
  let h='';
  const s1=c.sol.steps[0];
  if(S.hints>=1&&S.state==='play'){
    h+=`<div class="hintbox"><div class="t">${t('h1t')}</div>${t('h1')} ${t('reason_'+s1.reason)}</div>`;
  }
  if(S.hints>=2&&S.state==='play'){
    const s2=c.sol.steps[1];
    h+=`<div class="hintbox"><div class="t">${t('h2t')}</div>${t('h2a')}<div class="mini">${s1.a} ${s1.op} ${s1.b} = ${s1.r}</div>`+
       (s2?`${t('h2b')}<div class="mini">${exprHTML(s1.next,s2.hl)} <span class="eq">=</span> ?</div>`:t('h2c'))+`</div>`;
  }
  if(S.state!=='play'){
    h+=`<div class="hintbox"><div class="t">${S.state==='revealed'?t('h3t'):t('solTitle')}</div>${stepsHTML(c.sol)}</div>`;
  }
  $('hints').innerHTML=h;
  // feedback
  const fb=S.fb;let f='';
  if(fb){
    if(fb.type==='good')f=`<div class="fb good"><b>${T[lang].correct[fb.i]}</b><br>${t('pts',fb.p)}</div>`;
    else if(fb.type==='revealed')f=`<div class="fb info">${t('revealed')}</div>`;
    else{
      const msg=fb.type==='ltr'?t('wrongLTR'):fb.type==='paren'?t('wrongParen'):t('wrong');
      f=`<div class="fb bad">${msg}${S.wrong>=2&&S.hints<MAXH?'<br>'+t('tryHint'):''}</div>`;
    }
  }
  $('fb').innerHTML=f;
}

function press(k){
  if(S.state!=='play')return;
  if(k==='⌫'){S.input=S.input.slice(0,-1);}
  else if(k==='✓'){check();return;}
  else if(S.input.length<4){S.input=(S.input==='0'?'':S.input)+k;}
  S.fb=S.fb&&S.fb.type!=='good'?S.fb:null;
  renderGame();
}

function check(){
  if(!S.input)return;
  const v=+S.input,c=S.cur;
  if(v===c.sol.value){
    const p=Math.max(1,10-3*S.hints-S.wrong);
    S.score+=p;
    S.streak=(S.hints===0&&S.wrong===0)?S.streak+1:0;
    S.state='done';S.fb={type:'good',p,i:R(0,T.es.correct.length-1)};
    renderGame();burst();
  }else{
    S.wrong++;S.streak=0;
    let type='bad';
    if(c.nop!==null&&v===c.nop&&c.nop!==c.sol.value)type='paren';
    else if(c.ltr!==null&&v===c.ltr&&c.ltr!==c.sol.value)type='ltr';
    S.fb={type};S.input='';
    renderGame();
    const a=$('answer');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');
  }
}

function useHint(){
  if(S.state!=='play'||S.hints>=MAXH)return;
  S.hints++;
  if(S.hints===MAXH){S.state='revealed';S.streak=0;S.fb={type:'revealed'};}
  renderGame();
  $('hints').lastElementChild&&$('hints').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(S.qn>=TOTAL){finish();}else newQuestion(); }

function finish(){
  const prev=store.get('oc-best-'+S.level);
  S.newRecord=prev===null||S.score>+prev;
  if(S.newRecord)store.set('oc-best-'+S.level,S.score);
  show('end');renderEnd();if(S.score>=50)burst(24);
}
function renderEnd(){
  const st=S.score>=80?3:S.score>=50?2:1;
  $('stars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('endScore').textContent=t('endScore',S.score);
  $('endMsg').textContent=t('end'+st);
  $('record').textContent=S.newRecord?t('record'):'';
}

function burst(n=12){
  const em=['⭐','🎉','✨','🌟','💫'];
  const r=$('answer').getBoundingClientRect();
  const x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='pop';s.textContent=pick(em);
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',R(-160,160)+'px');s.style.setProperty('--dy',R(-180,60)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}

/* ---------- eventos ---------- */
$('hintBtn').onclick=useHint;
$('nextBtn').onclick=next;
$('backBtn').onclick=()=>{show('start');renderStatic();};
$('againBtn').onclick=()=>startLevel(S.level);
$('levelsBtn').onclick=()=>{show('start');renderStatic();};
$('lang-es').onclick=()=>{lang='es';store.set('oc-lang','es');renderStatic();};
$('lang-en').onclick=()=>{lang='en';store.set('oc-lang','en');renderStatic();};
document.addEventListener('keydown',e=>{
  if($('game').classList.contains('hidden'))return;
  if(S.state!=='play'){if(e.key==='Enter')next();return;}
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')press('⌫');
  else if(e.key==='Enter')press('✓');
});
lang='en';
renderStatic();
</script>
</body>
</html>
